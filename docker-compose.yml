services:
  rulo-video-studio:
    build: .
    container_name: rulo-video-studio
    restart: unless-stopped
    ports:
      - "8085:8085"
    env_file:
      - .env
    environment:
      - USE_LOCAL_OLLAMA=false
    volumes:
      - ./media:/app/media
    networks:
      - default
      - proxy-network

networks:
  proxy-network:
    external: true